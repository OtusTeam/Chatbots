services:
  mcp-server:
    build:
      context: ..
      dockerfile: bonus/Dockerfile
    env_file:
      - path: .env
        required: false
    command: uvicorn mcp_server.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3.0).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: bonus/Dockerfile
    env_file:
      - path: .env
        required: false
    command: python -m bot.app
    depends_on:
      mcp-server:
        condition: service_healthy
